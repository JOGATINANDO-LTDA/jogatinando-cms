; Jogatinando CMS — PHP Configuration
; Para hospedagem compartilhada: copie este arquivo como php.ini na raiz do site
; ou adicione as diretivas ao painel de controle da hospedagem (cPanel, Plesk, etc.)

post_max_size = 110M
upload_max_filesize = 100M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
display_errors = 0
log_errors = 1
