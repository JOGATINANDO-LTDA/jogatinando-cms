services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - cms-data:/var/www/html/data
      - cms-uploads:/var/www/html/uploads
    environment:
      - SITE_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword2024
      MYSQL_DATABASE: jogatinando
      MYSQL_USER: jogatinando
      MYSQL_PASSWORD: jogatinando2024
    volumes:
      - cms-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword2024"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cms-data:
    driver: local
  cms-uploads:
    driver: local
  cms-mysql:
    driver: local
