services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - cms-data:/var/www/html/data
      - cms-uploads:/var/www/html/uploads
    environment:
      - SITE_URL=http://localhost:8080
      # S3-compatible storage (Cloudflare R2) — preencha docker/.env ou export
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - INSTALL_LOCK=${INSTALL_LOCK:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_cms2024
    volumes:
      - cms-mysql:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-grant.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_cms2024"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cms-data:
    driver: local
  cms-uploads:
    driver: local
  cms-mysql:
    driver: local
